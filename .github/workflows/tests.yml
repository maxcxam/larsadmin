name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # All six combinations resolve; composer picks the dev tooling per combo
        # (verified with `composer show -a`):
        #   PHP 8.3          -> Pest 4 / pest-plugin-laravel 4 (Pest 5 needs PHP ^8.4)
        #   PHP 8.4, 8.5     -> Pest 5 / pest-plugin-laravel 5 (both accept Laravel 12 and 13)
        #   Laravel 12.*     -> orchestra/testbench 10 (requires laravel/framework ^12)
        #   Laravel 13.*     -> orchestra/testbench 11 (requires laravel/framework ^13)
        # The pin below plus --with-all-dependencies lets composer switch
        # testbench/pest majors instead of failing on the locked/default ones.
        #   laravel/mcp (require-dev, ^0.7.1|^0.8|^0.9|^1.0) needs illuminate/* ^12.41.1|^13.0;
        #   the 12.* leg resolves to the latest 12.x, so it is always satisfied.
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        # 'latest' = whatever composer resolves from the require-dev range.
        mcp: ['latest']
        # Coverage runs in exactly one cell (pcov, fails below 90% line coverage);
        # every other cell runs the plain suite with coverage: none.
        include:
          - php: '8.4'
            laravel: '13.*'
            coverage: true
          # Lower bound of the supported laravel/mcp range (design 1.6 §10, ADR-037).
          # Overriding the original `mcp` value makes this a new (7th) cell instead of
          # merging into the coverage cell.
          - php: '8.4'
            laravel: '13.*'
            mcp: '0.7.*'
          # laravel/mcp is optional (suggest only): the package must work without it.
          # MCP tests that need the package skip themselves here.
          - php: '8.3'
            laravel: '12.*'
            mcp: 'none'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.mcp != 'latest' && format(' / laravel/mcp {0}', matrix.mcp) || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          if [ "${{ matrix.mcp }}" = "none" ]; then
            composer remove --dev laravel/mcp --no-update --no-interaction
          elif [ "${{ matrix.mcp }}" != "latest" ]; then
            composer require --dev "laravel/mcp:${{ matrix.mcp }}" --no-update --no-interaction
          fi
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: vendor/bin/pest

      - name: Run tests with coverage (min 90%)
        if: ${{ matrix.coverage }}
        run: vendor/bin/pest --coverage --min=90

  frontend:
    runs-on: ubuntu-latest

    name: Frontend (Node 22)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check that dist/ and kit/sdk.js are up to date
        run: git diff --exit-code dist kit/sdk.js

      # Public extension API (design 1.5 §18.3 X6, ADR-034): the `larsadmin` SDK, dist/runtime, kit, stable PHP
      # members and the props/events of overridable built-ins (§5.6) must match kit/public-api.json.
      # Removals fail (frozen for 1.x); additions need `npm run check:api -- --update`.
      - name: Check the public extension API
        run: npm run check:api
